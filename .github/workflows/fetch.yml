name: RSS Feeds holen
on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

# Nie zwei Läufe gleichzeitig – sonst blockieren sie sich beim Commit
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # harte Obergrenze für den gesamten Job
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Feeds holen (News, EU, Bundestag, Bundesländer, USA, Dokumente)
        timeout-minutes: 14          # Reserve über dem Budget des Skripts
        env:
          NEWS_BUDGET_MIN: '9'       # Skript beendet sich selbst nach 9 Minuten
          FEED_WORKERS: '8'          # parallele Abrufe
          FEED_TIMEOUT: '10'         # Sekunden je Feed
          ARCHIVE: '1'               # ältere Meldungen in archive/YYYY-MM.json sichern
          NEWS_ARTICLE_SHARE: '0.75' # Anteil des Budgets für Nachrichten;
                                     # Dokumente bekommen nur die Restzeit
        run: python fetch_news.py

      # Verzeichnis, DIP, Kalender, Newsletter.
      # Läuft nur im ersten Lauf jeder Stunde und hat ein eigenes Zeitbudget:
      # Was nicht hineinpasst (Landtage, MEP-Details, Profilfotos), macht der nächste Lauf.
      - name: Wahlen (Termine, Umfragen, Ergebnisse)
        timeout-minutes: 6
        env:
          ELECTION_BUDGET_MIN: '4'
        run: python fetch_elections.py

      - name: Verzeichnis, DIP & Kalender
        timeout-minutes: 10
        env:
          DIP_KEY: ${{ secrets.DIP_KEY }}
          TAGESLAGE_FEED: ${{ secrets.TAGESLAGE_FEED }}
          TIME_BUDGET_MIN: '8'      # Skript beendet sich selbst nach 8 Minuten
          LANDTAGE_PER_RUN: '4'     # 16 Landtage in 4 Läufen
          EP_DETAILS_PER_RUN: '150' # ~720 MEPs in 5 Läufen
          ENRICH_PER_RUN: '40'
          WIKI_PER_RUN: '15'
          AUSSCHUSS_DETAIL_PER_RUN: '8'   # Ausschuss-Mitglieder je Lauf von bundestag.de
          # KI: OpenRouter hat Vorrang, Groq ist die Rückfallebene. Ohne Schlüssel
          # läuft alles Übrige unverändert weiter.
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          OR_MODEL: 'meta-llama/llama-3.3-70b-instruct:free'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_PER_RUN: '25'                          # Vorgänge je Lauf        # Wikipedia drosselt ab ~20 Abrufen (HTTP 429)
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" -lt 25 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python fetch_directory.py
          else
            echo "Verzeichnis übersprungen (läuft im ersten Lauf jeder Stunde)"
          fi

      # Sicherheitsnetz: Konfliktmarker aus fruheren Laeufen entfernen und
      # kaputte Dateien gar nicht erst committen.
      - name: JSON prüfen
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os, subprocess, sys
          bad = []
          for f in sorted(glob.glob("*.json")):
              raw = open(f, encoding="utf-8", errors="replace").read()
              if raw.lstrip().startswith("<<<<<<<") or "\n=======\n" in raw and ">>>>>>>" in raw:
                  print(f"  {f}: Git-Konfliktmarker gefunden -> aus dem Index nehmen")
                  subprocess.run(["git", "checkout", "--", f], check=False)
                  bad.append(f); continue
              try:
                  json.load(open(f, encoding="utf-8"))
                  print(f"  {f}: ok")
              except Exception as e:
                  print(f"  {f}: UNGUELTIG ({e}) -> alte Version wiederherstellen")
                  subprocess.run(["git", "checkout", "--", f], check=False)
                  bad.append(f)
          if bad:
              print("Wiederhergestellt: " + ", ".join(bad))
          PY

      - name: JSON-Dateien committen
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # KEIN stash/pop mehr. Das erzeugte Konfliktmarker mitten in den
          # JSON-Dateien ("<<<<<<< Updated upstream"), die dann committet wurden
          # und im Browser als "kein gueltiges JSON" ankamen.
          # Diese Dateien werden ausschliesslich hier erzeugt: der frisch
          # erzeugte Stand gewinnt immer.
          for f in articles.json eu_articles.json bundestag_articles.json \
                   laender_articles.json us_articles.json documents.json \
                   people.json dip.json calendar.ics newsletters.json elections.json \
                   people_cache.json landtage_cache.json groq_cache.json ai.json; do
            [ -e "$f" ] && git add "$f" && echo "  + $f"
          done
          [ -d docs_files ] && git add docs_files/ || true
          [ -d archive ] && git add archive/ && echo "  + archive/" || true

          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Committen."
            exit 0
          fi
          git commit -m "chore: update feeds [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # Push; bei zwischenzeitlichen Fremdänderungen genau einmal nachziehen
          # und dabei unsere Version der Datendateien behalten.
          if ! git push; then
            echo "Push abgelehnt – ziehe nach."
            git fetch origin main
            git rebase -X ours origin/main || {
              echo "Rebase gescheitert – nehme unseren Stand."
              git rebase --abort || true
              git reset --soft origin/main
              git commit -m "chore: update feeds (neu aufgesetzt)" || true
            }
            git push
          fi
          echo "Committet und gepusht."
