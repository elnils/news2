name: RSS Feeds holen
on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

# Nie zwei Läufe gleichzeitig – sonst blockieren sie sich beim Commit
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # harte Obergrenze für den gesamten Job
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # spaCy erkennt echte Eigennamen (Personen, Organisationen, Orte) statt
      # nur Großschreibung. Optional: schlägt die Installation fehl, läuft der
      # Abruf unverändert weiter, nur die Begriffserkennung bleibt die alte.
      - name: spaCy für Entitätenerkennung (optional)
        continue-on-error: true
        run: |
          pip install --quiet spacy
          pip install --quiet https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl
          # Englisches Modell für englischsprachige Quellen (Reuters, AP, Politico)
          pip install --quiet https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      # v10: fetch_news.py liefert zusätzlich herkunft, gericht/az/ls und
      # personen je Meldung sowie die Feeds von BVerwG, BAG, BSG, BFH und EuG.
      # Keine neue Abhängigkeit, kein neues Secret.
      - name: Feeds holen (News, EU, Bundestag, Bundesländer, USA, Dokumente)
        timeout-minutes: 16          # Reserve über dem Budget des Skripts
        env:
          NEWS_BUDGET_MIN: '8'       # Skript beendet sich selbst nach 8 Minuten
          FEED_WORKERS: '8'          # parallele Abrufe
          FEED_TIMEOUT: '10'         # Sekunden je Feed
          FEED_FALLBACK: '1'         # gescheiterte Feeds über Nachrichtensuche nachholen
          PREMIUM_PASSWORD: ${{ secrets.PREMIUM_PASSWORD }}   # optional: gemeinsamer Pro-Zugang
          SPACY: '1'                 # 0 = Entitätenerkennung abschalten
          ARCHIVE: '1'               # ältere Meldungen in archive/YYYY-MM.json sichern
          NEWS_ARTICLE_SHARE: '0.75' # Anteil des Budgets für Nachrichten;
                                     # Dokumente bekommen nur die Restzeit
        run: python fetch_news.py

      # NEU (v10): Anreicherung nachtragen – verteilt über mehrere Läufe.
      # Der Abruf oben reichert nur die frischen Meldungen an. Ältere
      # Bestände und die Monatsdateien unter archive/ arbeitet dieses Skript
      # portionsweise ab: eigenes Zeitbudget, fertige Monate werden mit
      # "angereichert": "v10" markiert und künftig übersprungen.
      - name: Anreicherung nachtragen (Bestand und Archiv)
        continue-on-error: true
        timeout-minutes: 4
        env:
          NACHTRAG_BUDGET_MIN: '2.5'
          NACHTRAG_DATEIEN: '3'
        run: python nachtragen.py

      # NEU (v10): Zusammenfassungen der wichtigsten Meldungen.
      # OpenRouter zuerst, Groq als Rückfall – dieselben Secrets wie beim
      # Verzeichnis. Schreibt ki_meldungen.json (ai.json gehört weiter dem
      # Verzeichnis-Skript). Überspringt, was schon zusammengefasst ist;
      # KI_MAX begrenzt die Zahl neuer Anfragen je Lauf.
      # NEU (v11): Das Skript wechselt das Modell selbst, wenn OpenRouter es
      # aus dem kostenlosen Kontingent nimmt ("unavailable for free") - erst
      # auf den in der Fehlermeldung genannten Nachfolger, dann auf ein
      # anderes freies Modell, zuletzt auf Groq. OR_MODEL ist nur der
      # Startwert. Zusaetzlich stellt es je Region die zehn wichtigsten
      # Ereignisse zusammen wie die Tageslage: doppelte Berichte buendeln
      # (auch ueber Sprachgrenzen), nach Nachrichtenwert waehlen, Schlagzeile
      # und Satz schreiben. Alle zwei Stunden, je Lauf hoechstens drei Regionen.
      - name: KI-Zusammenfassungen und Top-Auswahl (Meldungen)
        continue-on-error: true
        timeout-minutes: 8
        env:
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          OR_MODEL: 'meta-llama/llama-3.3-70b-instruct'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KI_MAX: '48'                 # Meldungen je Lauf, die eine Zusammenfassung bekommen
          KI_BATCH: '8'                # Meldungen je Anfrage (48 Meldungen = 6 Anfragen)
          KI_KEEP_DAYS: '7'
          KI_SCHLAG_N: '10'            # Ereignisse je Region
          KI_SCHLAG_KANDIDATEN: '30'   # so viele Gruppen sieht das Modell zur Auswahl
          KI_SCHLAG_MIN: '120'         # alle zwei Stunden neu zusammenstellen
          KI_SCHLAG_REGIONEN: '3'      # Regionen je Lauf (6 Regionen = 2 Laeufe)
        run: python ki_zusammenfassungen.py

      # NEU (v10): Kurse für die Ansicht "Märkte". Kein Schlüssel nötig.
      # Lässt bei Fehlschlag die alte markets.json stehen.
      - name: Märkte (Indizes, Energie, Zinsen, Devisen)
        continue-on-error: true
        timeout-minutes: 8
        env:
          MARKET_TIMEOUT: '12'
          MARKET_PAUSE: '0.25'   # 113 Werte × 2 Abrufe ≈ 2 Minuten
        run: python fetch_markets.py

      # Verzeichnis, DIP, Kalender, Newsletter.
      # Läuft nur im ersten Lauf jeder Stunde und hat ein eigenes Zeitbudget:
      # Was nicht hineinpasst (Landtage, MEP-Details, Profilfotos), macht der nächste Lauf.
      - name: Wahlen (Termine, Umfragen, Ergebnisse)
        timeout-minutes: 6
        env:
          ELECTION_BUDGET_MIN: '4'
        run: python fetch_elections.py

      # NEU (v11): Derselbe Lauf holt jetzt auch die namentlichen Abstimmungen
      # des Bundestags (abgeordnetenwatch) nach votes.json und schreibt die
      # Sitzverteilung je Parlament nach people.json → "seats".
      # Weil das zusätzliche Abrufe sind, bekommt der Schritt mehr Luft:
      # 14 Minuten Obergrenze, 11 Minuten Eigenbudget.
      - name: Verzeichnis, DIP, Abstimmungen & Kalender
        timeout-minutes: 14
        env:
          DIP_KEY: ${{ secrets.DIP_KEY }}
          TAGESLAGE_FEED: ${{ secrets.TAGESLAGE_FEED }}
          TIME_BUDGET_MIN: '11'     # Skript beendet sich selbst nach 11 Minuten
          LANDTAGE_PER_RUN: '6'     # 16 Landtage in 3 Läufen statt 4
          POLLS_PER_RUN: '12'       # namentliche Abstimmungen je Lauf (je ~630 Stimmen)
          VOTES_BUDGET_SEC: '150'   # eigenes Zeitfenster dafür, läuft direkt nach dem Bundestag
          VOTES_WAHLPERIODEN: '2'   # laufende + vorige; die vorige erst, wenn die laufende komplett ist
          POLLS_MAX: '80'           # so viele Abstimmungen der Wahlperiode insgesamt
          VOTES_PER_PERSON: '40'    # Stimmverhalten je Person in people.json
          EP_DETAILS_PER_RUN: '150' # ~720 MEPs in 5 Läufen
          ENRICH_PER_RUN: '40'
          WIKI_PER_RUN: '15'        # Wikipedia drosselt ab ~20 Abrufen (HTTP 429)
          AUSSCHUSS_DETAIL_PER_RUN: '8'   # Ausschuss-Mitglieder je Lauf von bundestag.de
          # KI: OpenRouter hat Vorrang, Groq ist die Rückfallebene. Ohne Schlüssel
          # läuft alles Übrige unverändert weiter.
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          OR_MODEL: 'meta-llama/llama-3.3-70b-instruct:free'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_PER_RUN: '25'        # Vorgänge je Lauf
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" -lt 25 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python fetch_directory.py
          else
            echo "Verzeichnis übersprungen (läuft im ersten Lauf jeder Stunde)"
          fi

      # Sicherheitsnetz: Konfliktmarker aus früheren Läufen entfernen und
      # kaputte Dateien gar nicht erst committen.
      - name: JSON prüfen
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os, subprocess, sys
          bad = []
          for f in sorted(glob.glob("*.json")):
              raw = open(f, encoding="utf-8", errors="replace").read()
              if raw.lstrip().startswith("<<<<<<<") or "\n=======\n" in raw and ">>>>>>>" in raw:
                  print(f"  {f}: Git-Konfliktmarker gefunden -> aus dem Index nehmen")
                  subprocess.run(["git", "checkout", "--", f], check=False)
                  bad.append(f); continue
              try:
                  json.load(open(f, encoding="utf-8"))
                  print(f"  {f}: ok")
              except Exception as e:
                  print(f"  {f}: UNGUELTIG ({e}) -> alte Version wiederherstellen")
                  subprocess.run(["git", "checkout", "--", f], check=False)
                  bad.append(f)
          if bad:
              print("Wiederhergestellt: " + ", ".join(bad))
          PY

      # Protokoll-Index: je Lauf wenige Sitzungen, bis die Wahlperiode
      # vollständig ist. Bricht nie den übrigen Ablauf ab.
      - name: Plenarprotokolle indizieren (inkrementell)
        continue-on-error: true
        env:
          DIP_KEY: ${{ secrets.DIP_KEY }}
          WAHLPERIODE: '21'
          PROTO_PER_RUN: '5'
          PROTO_BUDGET_MIN: '3'
        run: python3 fetch_protokolle.py

      # NEU (v12): Nicht-namentliche Abstimmungen und Reden aus den
      # Plenarprotokollen. Liest je Lauf wenige neue Protokolle, erkennt jede
      # Abstimmung per Handzeichen mit Ergebnis und Fraktionsverhalten, dazu
      # die Reden je Tagesordnungspunkt, und schreibt plenum_votes.json. Welche Protokolle fertig sind, steht in
      # plenum_cache.json. Bricht nie den uebrigen Ablauf ab.
      - name: Abstimmungen per Handzeichen (Plenarprotokolle)
        continue-on-error: true
        timeout-minutes: 5
        env:
          DIP_KEY: ${{ secrets.DIP_KEY }}
          WAHLPERIODE: '21'
          PLENUM_PER_RUN: '6'        # Protokolle je Lauf
          PLENUM_BUDGET_MIN: '3'
          WAHLPERIODEN: '21,20,19'   # aktuelle zuerst; ältere erst, wenn die neuere vollständig ist
          # Koalition und Fraktionen stehen je Wahlperiode im Skript (WP_INFO).
          # Nach einem Regierungswechsel lässt sich die laufende übersteuern:
          # KOALITION: '…,…'   FRAKTIONEN: '…,…,…'
          REDEN_TAGE: '120'          # Reden so lange aufbewahren
        run: python3 fetch_plenum.py

      - name: JSON-Dateien committen
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # KEIN stash/pop mehr. Das erzeugte Konfliktmarker mitten in den
          # JSON-Dateien ("<<<<<<< Updated upstream"), die dann committet wurden
          # und im Browser als "kein gueltiges JSON" ankamen.
          # Diese Dateien werden ausschliesslich hier erzeugt: der frisch
          # erzeugte Stand gewinnt immer.
          # NEU (v10): markets.json und ki_meldungen.json
          # NEU (v11): votes.json (namentliche Abstimmungen) und votes_cache.json.
          # Der Zwischenspeicher MUSS mitcommittet werden - sonst holt jeder
          # Lauf dieselben zwoelf Abstimmungen erneut und der Bestand waechst nie.
          for f in articles.json eu_articles.json bundestag_articles.json \
                   laender_articles.json us_articles.json documents.json \
                   people.json dip.json calendar.ics newsletters.json elections.json \
                   people_cache.json landtage_cache.json groq_cache.json ai.json access.json \
                   markets.json ki_meldungen.json votes.json votes_cache.json \
                   plenum_votes.json plenum_cache.json; do
            [ -e "$f" ] && git add "$f" && echo "  + $f"
          done
          [ -d docs_files ] && git add docs_files/ || true
          [ -d archive ] && git add archive/ && echo "  + archive/" || true
          [ -d protokolle ] && git add protokolle/ && echo "  + protokolle/" || true

          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Committen."
            exit 0
          fi
          git commit -m "chore: update feeds [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # Push; bei zwischenzeitlichen Fremdänderungen genau einmal nachziehen
          # und dabei unsere Version der Datendateien behalten.
          if ! git push; then
            echo "Push abgelehnt – ziehe nach."
            git fetch origin main
            git rebase -X ours origin/main || {
              echo "Rebase gescheitert – nehme unseren Stand."
              git rebase --abort || true
              git reset --soft origin/main
              git commit -m "chore: update feeds (neu aufgesetzt)" || true
            }
            git push
          fi
          echo "Committet und gepusht."
