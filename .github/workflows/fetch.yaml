name: RSS Feeds holen
on:
  # Zeiten in UTC. Deutsche Zeit = UTC+2 im Sommer, UTC+1 im Winter.
  # Morgenlauf 03:00 UTC (5 Uhr Sommerzeit): ausgiebiger, mit Vorausschau
  # und Quellenprüfung. Tagsüber alle zwei Stunden bis 21:00 UTC (23 Uhr).
  # Nachts Pause. Hinweis: GitHub startet geplante Läufe oft 5–30 Minuten später
  # und LÄSST zur vollen Stunde bei hoher Last Läufe ganz ausfallen – deshalb
  # Minute 13 statt 0 (so fiel der Morgenlauf um 5 Uhr aus). Der zweite
  # Morgentermin um 3:43 UTC fängt einen ausgefallenen ersten auf; Vorausschau
  # und Quellenprüfung laufen trotzdem nur einmal am Tag.
  schedule:
    - cron: '13 3 * * *'
    - cron: '43 3 * * *'
    - cron: '13 5-21/2 * * *'
  # Von Hand starten (Actions → Workflow → "Run workflow"): Dort lassen sich
  # Vorausschau und Quellenprüfung neu erzwingen, auch wenn sie heute schon
  # gelaufen sind – etwa nach einem fehlerhaften Lauf.
  workflow_dispatch:
    inputs:
      vorausschau_neu:
        description: 'Vorausschau neu erstellen (auch wenn heute schon gelaufen)'
        type: boolean
        default: true
      quellen_neu:
        description: 'Quellenprüfung neu ausführen'
        type: boolean
        default: false
      morgenlauf:
        description: 'Als Morgenlauf ausführen (mehr Zeit, größere Portionen)'
        type: boolean
        default: false

# Nie zwei Läufe gleichzeitig – sonst blockieren sie sich beim Commit
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Harte Obergrenze für den ganzen Job. Vorher 25 Minuten – zu knapp für alle
    # Schritte: Der Job wurde abgebrochen, BEVOR er committen konnte, und neue
    # Meldungen erschienen nur, wenn ein Lauf zufällig kurz war.
    # Tagsüber reichen rund 40 Minuten, der Morgenlauf braucht mehr. Die
    # Meldungen werden ohnehin nach dem KI-Schritt schon veröffentlicht.
    timeout-minutes: 90
    env:
      # Im Morgenlauf bekommen die Skripte mehr Zeit und größere Portionen.
      MORGENLAUF: ${{ (github.event.schedule == '13 3 * * *' || github.event.schedule == '43 3 * * *' || inputs.morgenlauf) && '1' || '0' }}
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # spaCy erkennt echte Eigennamen (Personen, Organisationen, Orte) statt
      # nur Großschreibung. Optional: schlägt die Installation fehl, läuft der
      # Abruf unverändert weiter, nur die Begriffserkennung bleibt die alte.
      - name: spaCy für Entitätenerkennung (optional)
        continue-on-error: true
        run: |
          pip install --quiet spacy
          pip install --quiet https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl
          # Englisches Modell für englischsprachige Quellen (Reuters, AP, Politico)
          pip install --quiet https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      # v10: fetch_news.py liefert zusätzlich herkunft, gericht/az/ls und
      # personen je Meldung sowie die Feeds von BVerwG, BAG, BSG, BFH und EuG.
      # Keine neue Abhängigkeit, kein neues Secret.
      - name: Feeds holen (News, EU, Bundestag, Bundesländer, USA, Dokumente)
        timeout-minutes: 22          # Reserve über dem Budget des Skripts
        env:
          NEWS_BUDGET_MIN: ${{ env.MORGENLAUF == '1' && '14' || '8' }}   # morgens ausgiebiger
          FEED_WORKERS: '8'          # parallele Abrufe
          FEED_TIMEOUT: '10'         # Sekunden je Feed
          FEED_FALLBACK: '1'         # gescheiterte Feeds über Nachrichtensuche nachholen
          PREMIUM_PASSWORD: ${{ secrets.PREMIUM_PASSWORD }}   # optional: gemeinsamer Pro-Zugang
          SPACY: '1'                 # 0 = Entitätenerkennung abschalten
          ARCHIVE: '1'               # ältere Meldungen in archive/YYYY-MM.json sichern
          NEWS_ARTICLE_SHARE: '0.75' # Anteil des Budgets für Nachrichten;
                                     # Dokumente bekommen nur die Restzeit
        run: python fetch_news.py

      # NEU (v16): Dieselbe Meldung aus mehreren Feeds eines Hauses nur einmal.
      # Jede Meldung bekommt "haus" (Domain der Adresse: heise.de, reuters.com)
      # und "uid" (feste Kennung aus der bereinigten Adresse). Kopien aus
      # "Heise Telco"/"Heise Security" oder "Reuters Tech"/"Reuters Top"
      # werden zusammengeführt, ihre Feeds stehen im Feld "feeds".
      # NEU (v17): Fehlende seriöse Häuser (AP, Reuters, NYT, FAZ, SZ, FT …)
      # automatisch über die Google-News-Suche je Website ergänzen, wenn ihr
      # Feed in 24 Stunden weniger als drei Meldungen geliefert hat.
      # NEU (v18): Neueste Wahlumfrage je Parlament aus DAWUM, mit richtigen
      # Parteinamen (in Landtagsumfragen fehlte sonst die CDU).
      - name: Umfragen (DAWUM)
        continue-on-error: true
        timeout-minutes: 2
        run: python umfragen.py

      - name: Pflichtquellen ergänzen
        continue-on-error: true
        timeout-minutes: 5
        env:
          QE_MIN_JE_HAUS: '3'
          QE_MAX_JE_HAUS: '15'
          QE_BUDGET_SEC: '180'
        run: python quellen_ergaenzen.py

      - name: Meldungen entdoppeln (gleiches Haus, gleicher Artikel)
        continue-on-error: true
        timeout-minutes: 2
        run: python entdoppeln.py

      # NEU (v10): Anreicherung nachtragen – verteilt über mehrere Läufe.
      # Der Abruf oben reichert nur die frischen Meldungen an. Ältere
      # Bestände und die Monatsdateien unter archive/ arbeitet dieses Skript
      # portionsweise ab: eigenes Zeitbudget, fertige Monate werden mit
      # "angereichert": "v10" markiert und künftig übersprungen.
      - name: Anreicherung nachtragen (Bestand und Archiv)
        continue-on-error: true
        timeout-minutes: 4
        env:
          NACHTRAG_BUDGET_MIN: '2.5'
          NACHTRAG_DATEIEN: '3'
        run: python nachtragen.py

      # NEU (v10): Zusammenfassungen der wichtigsten Meldungen.
      # OpenRouter zuerst, Groq als Rückfall – dieselben Secrets wie beim
      # Verzeichnis. Schreibt ki_meldungen.json (ai.json gehört weiter dem
      # Verzeichnis-Skript). Überspringt, was schon zusammengefasst ist;
      # KI_MAX begrenzt die Zahl neuer Anfragen je Lauf.
      # NEU (v10): Kurse für die Ansicht "Märkte". Läuft VOR den KI-Zusammen-
      # fassungen, damit die Marktlage mit frischen Kursen geschrieben wird. Kein Schlüssel nötig.
      # Lässt bei Fehlschlag die alte markets.json stehen.
      - name: Märkte (Indizes, Energie, Zinsen, Devisen)
        continue-on-error: true
        timeout-minutes: 8
        env:
          MARKET_TIMEOUT: '12'
          MARKET_PAUSE: '0.25'   # 113 Werte × 2 Abrufe ≈ 2 Minuten
        run: python fetch_markets.py

      # NEU (v13): Zusatzwerte für die Vorausschau – Agrarrohstoffe,
      # Branchen-ETFs, Rheinpegel Kaub. Ergänzt markets.json, fasst die
      # Gruppen von fetch_markets.py nicht an; Ausfälle behalten den alten Wert.
      - name: Märkte – Zusatzwerte für die Vorausschau
        continue-on-error: true
        timeout-minutes: 4
        env:
          MARKET_TIMEOUT: '12'
          MARKET_PAUSE: '0.25'
        run: python fetch_markets_extra.py

      # NEU (v11): Das Skript wechselt das Modell selbst, wenn OpenRouter es
      # aus dem kostenlosen Kontingent nimmt ("unavailable for free") - erst
      # auf den in der Fehlermeldung genannten Nachfolger, dann auf ein
      # anderes freies Modell, zuletzt auf Groq. OR_MODEL ist nur der
      # Startwert. Zusaetzlich stellt es je Region die zehn wichtigsten
      # Ereignisse zusammen wie die Tageslage: doppelte Berichte buendeln
      # (auch ueber Sprachgrenzen), nach Nachrichtenwert waehlen, Schlagzeile
      # und Satz schreiben. Alle zwei Stunden, je Lauf hoechstens drei Regionen.
      # NEU (v20): Einzelaktien (Kurse jeder Lauf) und – mit FMP_API_KEY –
      # die Bewertung gegen den eigenen KGV-Schnitt (einmal am Tag).
      - name: Aktien und Bewertung
        continue-on-error: true
        timeout-minutes: 6
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python aktien.py

      - name: KI-Zusammenfassungen, Top-Auswahl und Marktlage
        continue-on-error: true
        timeout-minutes: 12
        env:
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          OR_MODEL: 'meta-llama/llama-3.3-70b-instruct:free'   # nur freie Modelle – kein Guthabenverbrauch
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API: ${{ secrets.GEMINI_API }}     # Secret "gemini_api" – GitHub schreibt Namen groß
          KI_MAX: ${{ env.MORGENLAUF == '1' && '120' || '64' }}   # Meldungen je Lauf mit Zusammenfassung
          # Reihenfolge nach Kontingent der freien Stufen: Gemini (beste Qualität,
          # im Takt von 6,5 s), Groq (großzügigstes Tageskontingent), zuletzt
          # OpenRouter (ohne gekauftes Guthaben nur 50 freie Anfragen am Tag).
          KI_REIHENFOLGE: 'gemini,groq,openrouter'
          GEMINI_MODEL: 'gemini-flash-latest'
          KI_BATCH: '8'                # Meldungen je Anfrage (48 Meldungen = 6 Anfragen)
          KI_KEEP_DAYS: '7'
          KI_SCHLAG_N: '10'            # Ereignisse je Region
          KI_SCHLAG_KANDIDATEN: '30'   # so viele Gruppen sieht das Modell zur Auswahl
          KI_SCHLAG_MIN: '100'         # in jedem Lauf (alle zwei Stunden) neu zusammenstellen
          KI_SCHLAG_REGIONEN: '6'      # alle Regionen je Lauf – die Läufe liegen jetzt zwei Stunden auseinander
          KI_MARKT_ZEITEN: '9,16'      # Marktlage zweimal je Handelstag (Uhr, deutsche Zeit)
        run: python ki_zusammenfassungen.py

      # NEU (v15): Meldungen sofort veröffentlichen – nicht erst, wenn auch
      # Verzeichnis, Vorausschau und Protokolle fertig sind.
      - name: Zwischenstand veröffentlichen (Meldungen, KI, Märkte)
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in articles.json eu_articles.json bundestag_articles.json laender_articles.json \
                   us_articles.json documents.json ai.json markets.json ki_meldungen.json gesehen.json; do
            [ -e "$f" ] && git add "$f"
          done
          [ -d archive ] && git add archive/ || true
          git diff --cached --quiet && { echo "Nichts Neues."; exit 0; }
          git commit -m "chore: Meldungen [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push || { git fetch origin main && git rebase -X ours origin/main && git push; } || echo "Zwischenstand nicht gepusht – der Schlussschritt versucht es erneut."


      # NEU (v21): Weitere Newsletter-Feeds als normale Einträge im
      # Newsletter-Bereich (RSS oder Atom). Öffentliche Feeds (Deutsche Bank
      # Research) stehen im Skript; private Feeds wie Kill the Newsletter
      # gehören ins Secret NEWSLETTER_FEEDS (mehrere mit Komma), weil jeder
      # mit der Adresse den Newsletter lesen kann.
      - name: Newsletter-Feeds (DB Research, Kill the Newsletter …)
        continue-on-error: true
        timeout-minutes: 3
        env:
          NEWSLETTER_FEEDS: ${{ secrets.NEWSLETTER_FEEDS }}
        run: python newsletter.py

      # NEU (v19): Gerichtsentscheidungen und Bundestags-PDFs lesen – Leitsatz,
      # Tenor und eine KI-Kurzfassung statt "IV ZR 259/25, Entscheidung vom …".
      # Gespeichert wird nur ein Auszug, keine PDFs.
      - name: Dokumente lesen (Urteile, Drucksachen)
        continue-on-error: true
        timeout-minutes: 14
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          OR_MODEL: 'meta-llama/llama-3.3-70b-instruct:free'
          KI_REIHENFOLGE: 'gemini,groq,openrouter'
          DOK_PRO_LAUF: ${{ env.MORGENLAUF == '1' && '50' || '20' }}
          DOK_BUDGET_SEC: ${{ env.MORGENLAUF == '1' && '600' || '300' }}
        run: |
          pip install --quiet pypdf || echo "pypdf nicht installierbar – PDFs werden übersprungen"
          python dokumente_lesen.py

      # NEU (v22): Ressort-Briefings (Energie & Klima, Technik & Digitales,
      # Cyber & KI, Handel & Wirtschaft, Inneres & Sicherheit, Weltpolitik,
      # Verteidigung). Auswahl jeden Lauf, die KI-Lage einmal am Morgen.
      - name: Ressort-Briefings
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          OR_MODEL: 'meta-llama/llama-3.3-70b-instruct:free'
          KI_REIHENFOLGE: 'gemini,groq,openrouter'
        run: python briefings.py

      # NEU (v14): Quellenprüfung – einmal am Tag. Prüft jede Kursquelle auf
      # Erreichbarkeit, richtiges Kürzel (Währung, Name), Aktualität und
      # plausible Werte, dazu Pegelonline und GDELT. Ergebnis in
      # quellen_status.json; die App zeigt Auffälliges an.
      - name: Datenquellen prüfen (einmal täglich)
        continue-on-error: true
        timeout-minutes: 4
        env:
          QP_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.quellen_neu) && '1' || '0' }}
          QP_TIMEOUT: '15'
          QP_PAUSE: '0.3'
        run: python quellen_pruefen.py

      # NEU (v14): Vorausschau (Foresight) – einmal am Tag ab 7 Uhr deutscher
      # Zeit. Rechnet Wahrscheinlichkeiten aus Grundrate, Stärke des Zusammen-
      # hangs, Belegen und Kursbewegung; klassifiziert hybride Bedrohungen.
      # Übernimmt beim ersten Lauf eine vorhandene wirkungsketten_basis.json.
      - name: Vorausschau (einmal täglich)
        continue-on-error: true
        timeout-minutes: 12
        env:
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          OR_MODEL: 'meta-llama/llama-3.3-70b-instruct:free'   # nur freie Modelle – kein Guthabenverbrauch
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API: ${{ secrets.GEMINI_API }}     # Secret "gemini_api" – GitHub schreibt Namen groß
          VS_STUNDE: '5'          # im Morgenlauf (5 Uhr deutscher Zeit) – danach steht sie für den Tag
          VS_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.vorausschau_neu) && '1' || '0' }}
          VS_MAX: '10'            # höchstens so viele Zusammenhänge prüfen
          VS_MIN_HAEUSER: '2'     # so viele Häuser braucht ein Signal mindestens
          VS_FENSTER_H: '72'      # Meldungen der letzten 72 Stunden
          VS_GDELT: '1'           # weltweite Berichterstattung als zweites Signal (Ersatz: eigenes Archiv)
          VS_ARCHIV_MONATE: '12'  # so viele Monate aus archive/ für frühere Ereignisse
        run: python vorausschau.py

      # Verzeichnis, DIP, Kalender, Newsletter.
      # Läuft nur im ersten Lauf jeder Stunde und hat ein eigenes Zeitbudget:
      # Was nicht hineinpasst (Landtage, MEP-Details, Profilfotos), macht der nächste Lauf.
      - name: Wahlen (Termine, Umfragen, Ergebnisse)
        timeout-minutes: 6
        env:
          ELECTION_BUDGET_MIN: '4'
        run: python fetch_elections.py

      # NEU (v11): Derselbe Lauf holt jetzt auch die namentlichen Abstimmungen
      # des Bundestags (abgeordnetenwatch) nach votes.json und schreibt die
      # Sitzverteilung je Parlament nach people.json → "seats".
      # Weil das zusätzliche Abrufe sind, bekommt der Schritt mehr Luft:
      # 14 Minuten Obergrenze, 11 Minuten Eigenbudget.
      - name: Verzeichnis, DIP, Abstimmungen & Kalender
        timeout-minutes: 20
        env:
          DIP_KEY: ${{ secrets.DIP_KEY }}
          TAGESLAGE_FEED: ${{ secrets.TAGESLAGE_FEED }}
          TIME_BUDGET_MIN: ${{ env.MORGENLAUF == '1' && '16' || '11' }}   # morgens mehr Zeit
          LANDTAGE_PER_RUN: '6'     # 16 Landtage in 3 Läufen statt 4
          POLLS_PER_RUN: ${{ env.MORGENLAUF == '1' && '30' || '12' }}   # namentliche Abstimmungen je Lauf
          VOTES_BUDGET_SEC: '150'   # eigenes Zeitfenster dafür, läuft direkt nach dem Bundestag
          VOTES_WAHLPERIODEN: '2'   # laufende + vorige; die vorige erst, wenn die laufende komplett ist
          POLLS_MAX: '80'           # so viele Abstimmungen der Wahlperiode insgesamt
          VOTES_PER_PERSON: '40'    # Stimmverhalten je Person in people.json
          EP_DETAILS_PER_RUN: '150' # ~720 MEPs in 5 Läufen
          ENRICH_PER_RUN: '40'
          WIKI_PER_RUN: '15'        # Wikipedia drosselt ab ~20 Abrufen (HTTP 429)
          AUSSCHUSS_DETAIL_PER_RUN: '8'   # Ausschuss-Mitglieder je Lauf von bundestag.de
          # KI: OpenRouter hat Vorrang, Groq ist die Rückfallebene. Ohne Schlüssel
          # läuft alles Übrige unverändert weiter.
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          OR_MODEL: 'meta-llama/llama-3.3-70b-instruct:free'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API: ${{ secrets.GEMINI_API }}     # Secret "gemini_api" – GitHub schreibt Namen groß
          GROQ_PER_RUN: '25'        # Vorgänge je Lauf
        run: |
          # Läuft jetzt in jedem Lauf – die Läufe liegen zwei Stunden auseinander.
          python fetch_directory.py

      # Sicherheitsnetz: Konfliktmarker aus früheren Läufen entfernen und
      # kaputte Dateien gar nicht erst committen.
      - name: JSON prüfen
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os, subprocess, sys
          bad = []
          for f in sorted(glob.glob("*.json")):
              raw = open(f, encoding="utf-8", errors="replace").read()
              if raw.lstrip().startswith("<<<<<<<") or "\n=======\n" in raw and ">>>>>>>" in raw:
                  print(f"  {f}: Git-Konfliktmarker gefunden -> aus dem Index nehmen")
                  subprocess.run(["git", "checkout", "--", f], check=False)
                  bad.append(f); continue
              try:
                  json.load(open(f, encoding="utf-8"))
                  print(f"  {f}: ok")
              except Exception as e:
                  print(f"  {f}: UNGUELTIG ({e}) -> alte Version wiederherstellen")
                  subprocess.run(["git", "checkout", "--", f], check=False)
                  bad.append(f)
          if bad:
              print("Wiederhergestellt: " + ", ".join(bad))
          PY

      # Protokoll-Index: je Lauf wenige Sitzungen, bis die Wahlperiode
      # vollständig ist. Bricht nie den übrigen Ablauf ab.
      - name: Plenarprotokolle indizieren (inkrementell)
        continue-on-error: true
        env:
          DIP_KEY: ${{ secrets.DIP_KEY }}
          WAHLPERIODE: '21'
          PROTO_PER_RUN: ${{ env.MORGENLAUF == '1' && '12' || '5' }}
          PROTO_BUDGET_MIN: '3'
        run: python3 fetch_protokolle.py

      # NEU (v12): Nicht-namentliche Abstimmungen und Reden aus den
      # Plenarprotokollen. Liest je Lauf wenige neue Protokolle, erkennt jede
      # Abstimmung per Handzeichen mit Ergebnis und Fraktionsverhalten, dazu
      # die Reden je Tagesordnungspunkt, und schreibt plenum_votes.json. Welche Protokolle fertig sind, steht in
      # plenum_cache.json. Bricht nie den uebrigen Ablauf ab.
      - name: Abstimmungen per Handzeichen (Plenarprotokolle)
        continue-on-error: true
        timeout-minutes: 10
        env:
          DIP_KEY: ${{ secrets.DIP_KEY }}
          WAHLPERIODE: '21'
          PLENUM_PER_RUN: ${{ env.MORGENLAUF == '1' && '15' || '6' }}   # Protokolle je Lauf
          PLENUM_BUDGET_MIN: ${{ env.MORGENLAUF == '1' && '8' || '3' }}
          WAHLPERIODEN: '21,20,19'   # aktuelle zuerst; ältere erst, wenn die neuere vollständig ist
          # Koalition und Fraktionen stehen je Wahlperiode im Skript (WP_INFO).
          # Nach einem Regierungswechsel lässt sich die laufende übersteuern:
          # KOALITION: '…,…'   FRAKTIONEN: '…,…,…'
          REDEN_TAGE: '120'          # Reden so lange aufbewahren
        run: python3 fetch_plenum.py

      - name: JSON-Dateien committen
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # KEIN stash/pop mehr. Das erzeugte Konfliktmarker mitten in den
          # JSON-Dateien ("<<<<<<< Updated upstream"), die dann committet wurden
          # und im Browser als "kein gueltiges JSON" ankamen.
          # Diese Dateien werden ausschliesslich hier erzeugt: der frisch
          # erzeugte Stand gewinnt immer.
          # NEU (v10): markets.json und ki_meldungen.json
          # NEU (v11): votes.json (namentliche Abstimmungen) und votes_cache.json.
          # Der Zwischenspeicher MUSS mitcommittet werden - sonst holt jeder
          # Lauf dieselben zwoelf Abstimmungen erneut und der Bestand waechst nie.
          for f in articles.json eu_articles.json bundestag_articles.json \
                   laender_articles.json us_articles.json documents.json \
                   people.json dip.json calendar.ics newsletters.json elections.json \
                   people_cache.json landtage_cache.json groq_cache.json ai.json access.json \
                   markets.json ki_meldungen.json votes.json votes_cache.json \
                   plenum_votes.json plenum_cache.json \
                   vorausschau.json vorausschau_archiv.json vorausschau_basis.json vorausschau_kandidaten.json \
                   vorausschau_forschung.json gesehen.json umfragen.json dokumente_text.json bewertung.json newsletter_eigene.json briefings.json \
                   quellen_status.json; do
            [ -e "$f" ] && git add "$f" && echo "  + $f"
          done
          [ -d docs_files ] && git add docs_files/ || true
          [ -d archive ] && git add archive/ && echo "  + archive/" || true
          [ -d protokolle ] && git add protokolle/ && echo "  + protokolle/" || true

          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Committen."
            exit 0
          fi
          git commit -m "chore: update feeds [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          # Push; bei zwischenzeitlichen Fremdänderungen genau einmal nachziehen
          # und dabei unsere Version der Datendateien behalten.
          if ! git push; then
            echo "Push abgelehnt – ziehe nach."
            git fetch origin main
            git rebase -X ours origin/main || {
              echo "Rebase gescheitert – nehme unseren Stand."
              git rebase --abort || true
              git reset --soft origin/main
              git commit -m "chore: update feeds (neu aufgesetzt)" || true
            }
            git push
          fi
          echo "Committet und gepusht."
